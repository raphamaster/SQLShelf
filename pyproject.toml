[project]
name = "sqlshelf"
version = "1.0.11"
description = "Open-source desktop SQL query manager — organize, search and annotate .sql files"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raphael Franco", email = "raphael.rfranco@gmail.com" }]
dependencies = [
    "PySide6>=6.7",
    "PyYAML>=6.0",
    "qt-material>=2.14",
    "sqlglot>=23.0",
    "watchdog>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# black owns line length. It already wraps everything it can at 88; what is left
# over is string literals it will not split (SQL, Qt stylesheets, frontmatter
# fixtures), and breaking those by hand only makes them harder to read.
ignore = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
files = ["main.py", "sqlshelf", "tests"]
# Rules the codebase already satisfies. Deliberately short of --strict: the Qt
# layer overrides plenty of virtuals whose stubs use untyped *args, and forcing
# annotations there buys noise rather than safety.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# qt-material ships no py.typed marker.
module = ["qt_material.*"]
ignore_missing_imports = true
